<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn kéo quân</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/den-keo-quan.css">
</head>
<body>
    <header class="header">
        <h1>ĐÈN KÉO QUÂN</h1>

    <nav class="menu">
        <a href="index.html">Trang chủ</a>
    </nav>

    <main class="container lantern-page">
        <h2>Đèn kéo quân</h2>
        <p class="instruction"></p>

        <div class="lantern-area">

                <div class="face face1"><img src="Images/anh1.jpeg" alt="Hình ảnh 1"></div>
                <div class="face face2"><img src="Images/anh2.jpeg" alt="Hình ảnh 2"></div>
                <div class="face face3"><img src="Images/anh3.jpeg" alt="Hình ảnh 3"></div>
                <div class="face face4"><img src="Images/anh4.jpeg" alt="Hình ảnh 4"></div>
                <div class="face face5"><img src="Images/anh5.jpeg" alt="Hình ảnh 5"></div>
                <div class="face face6"><img src="Images/anh6.jpeg" alt="Hình ảnh 6"></div>
            </div>
        </div>

        <p id="status">Trạng thái: Đèn đang quay</p>
        
    </main>

    <footer class="footer">Bài kiểm tra giữa kỳ</footer>
    <script src="js/den-keo-quan.js"></script>

</html>
